name: Release Project

permissions:
  contents: read

# This workflow is triggered by pushes to the `master` branch that modify '.github/piper-cut-cl.json'.
# When `piper-cut-cl.json` changes, indicating a new release cut, the workflow proceeds to:
# 1.  Tag the repository at the current commit with the new version ID.
# 2.  Run the test suite.
# 3.  If tests pass, publish the release artifacts to Sonatype.
on:
  push:
    branches: [ master ]
    paths:
      - '.github/piper-cut-cl.json'

jobs:
  tag_release_version_id:
    name: Tag Release Version ID
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ fromJson(steps.set_piper_json_vars.outputs.piperJson).version_id }}
    steps:
    # Checkout the piper-cut-cl.json from the most recent commit
    - name: Checkout Current closure-compiler Commit
      # https://github.com/marketplace/actions/checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 1
        sparse-checkout: |
          .github/piper-cut-cl.json
          .github/ci_support/tag_release_version.sh
        sparse-checkout-cone-mode: false
        # Explicitly set persist-credentials to true so git credentials are saved for the git tag push step (b/533555133).
        persist-credentials: true

    - id: set_piper_json_vars
      # https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/accessing-contextual-information-about-workflow-runs#steps-context
      run: |
        {
            echo 'piperJson<<EOF'
            cat ./.github/piper-cut-cl.json
            echo EOF
        } >> "$GITHUB_OUTPUT"

    # Fetch all historical commits
    - name: Checkout all closure-compiler commits and tags
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # a depth of 0 triggers a fetch of all historical commits/branches/tags
        # https://github.com/marketplace/actions/checkout#Fetch-all-history-for-all-tags-and-branches
        fetch-depth: 0
        # Explicitly set persist-credentials to true so git credentials are saved for the git tag push step (b/533555133).
        persist-credentials: true

    - name: Tag cut CL
      id: tag_cut_cl
      run: |
          git config --global user.name "${GITHUB_ACTOR}"
          git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          .github/ci_support/tag_release_version.sh \
              "${PIPER_CUT_CL}" \
              "${VERSION_ID}";
      env:
        PIPER_CUT_CL: ${{ fromJson(steps.set_piper_json_vars.outputs.piperJson).piper_cut_cl }}
        VERSION_ID: ${{ fromJson(steps.set_piper_json_vars.outputs.piperJson).version_id }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  run-tests:
    uses: ./.github/workflows/run_tests.yaml
    needs: tag_release_version_id
    with:
      ref: ${{ needs.tag_release_version_id.outputs.tag }}

  publish-to-sonatype:
    runs-on: ubuntu-latest
    # Only publish if tests passed.
    needs: [tag_release_version_id, run-tests]
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check secrets are provided
        run: |
          check_secret() {
            if [[ -z "${2:-}" ]]; then
              echo "Error: secret ${1} is required but not provided."
              exit 1
            fi
          }
          check_secret "MAVEN_GPG_PRIVATE_KEY" "${{ secrets.MAVEN_GPG_PRIVATE_KEY }}"
          check_secret "MAVEN_GPG_PASSPHRASE" "${{ secrets.MAVEN_GPG_PASSPHRASE }}"

      - name: Checkout the repo at the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag_release_version_id.outputs.tag }}
          persist-credentials: false

      # Maven and Bazel require Java to be available.
      - name: Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '21'
          distribution: 'zulu'
          java-package: jdk
          # This will trigger the import of the private key in the GPG secret keyring.
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          # Create Maven settings.xml for staging artifacts to OSS Exit Gate Artifact Registry.
          server-id: oss-exit-gate
          server-username: AR_USERNAME
          server-password: AR_ACCESS_TOKEN
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      # https://github.com/bazel-contrib/setup-bazel
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          # Avoid downloading Bazel every time.
          bazelisk-cache: true
          # Store build cache per workflow.
          disk-cache: ${{ github.workflow }}
          # Share repository cache between workflows
          repository-cache: true

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Clean up prior staged artifacts in OSS Exit Gate repository
        run: |
          set -euo pipefail
          EXISTING_PKGS="$(gcloud artifacts packages list \
            --project=oss-exit-gate-prod \
            --location=us \
            --repository=closure-compiler--mavencentral \
            --format='value(name)' 2>/dev/null || true)"
          for pkg in ${EXISTING_PKGS}; do
            gcloud artifacts packages delete "${pkg}" \
              --project=oss-exit-gate-prod \
              --location=us \
              --repository=closure-compiler--mavencentral \
              --quiet || true
          done

      - name: Stage signed Maven artifacts to OSS Exit Gate
        run: |
          set -euo pipefail
          set +x
          export AR_USERNAME="oauth2accesstoken"
          export AR_ACCESS_TOKEN="$(gcloud auth print-access-token)"
          ./release.sh --oss-exit-gate
          unset AR_ACCESS_TOKEN
        env:
          RELEASE_NUM: ${{ needs.tag_release_version_id.outputs.tag }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Trigger OSS Exit Gate Maven Central release
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          cat <<'EOF' > manifest.json
          {
            "publish_all": false,
            "publishing_groups": [
              {
                "namespace": "com.google.javascript",
                "packages": [
                  { "name": "closure-compiler" },
                  { "name": "closure-compiler-externs" },
                  { "name": "closure-compiler-main" },
                  { "name": "closure-compiler-parent" },
                  { "name": "closure-compiler-unshaded" }
                ]
              }
            ]
          }
          EOF
          gcloud storage cp manifest.json \
            "gs://oss-exit-gate-prod-projects-bucket/closure-compiler/mavencentral/manifests/manifest-${RUN_ID}-${RUN_ATTEMPT}.json"
